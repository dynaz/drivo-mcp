name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate server.json against the current registry schema
        run: |
          npm install --no-save ajv@8 ajv-formats@3
          curl -fsSL https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json -o /tmp/server.schema.json
          node -e "
          const Ajv=require('ajv');const f=require('ajv-formats');
          const a=new Ajv({strict:false,allErrors:true});f(a);
          const v=a.compile(require('/tmp/server.schema.json'));
          const ok=v(require('./server.json'));
          if(!ok){console.error(v.errors);process.exit(1)} console.log('server.json valid')"
      - name: Docker build
        run: docker build -t drivo-mcp:ci .
